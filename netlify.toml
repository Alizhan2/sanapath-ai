# Netlify Configuration - Frontend Only (Backend is on Render)
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# SPA routing - redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables for build
# IMPORTANT: Set Firebase keys in Netlify Dashboard → Site Settings → Environment Variables
# Do NOT hardcode API keys here — they get committed to public git repo
[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "https://sanapath-ai.onrender.com"
  VITE_APP_NAME = "SanaPath AI"
